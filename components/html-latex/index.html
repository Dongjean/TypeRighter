<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instant LaTeX Renderer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        
        textarea { 
            width: 100%; height: 100px; padding: 15px; border: 2px solid #e0e0e0; 
            border-radius: 8px; font-family: 'Courier New', monospace; font-size: 16px;
            box-sizing: border-box; transition: border-color 0.2s; margin-bottom: 15px;
        }
        textarea:focus { border-color: #4A90E2; outline: none; }

        #outputContainer { 
            margin-top: 10px; padding: 20px; min-height: 80px;
            background: #ffffff; border-radius: 8px; border: 1px solid #eee;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8em; overflow-x: auto; margin-bottom: 20px;
        }

        button {
            width: 100%; padding: 12px; background: #4A90E2; color: white;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            font-size: 16px; margin-bottom: 10px;
        }
        button:hover { background: #357ABD; }
        button:disabled { background: #ccc; }

        .status { text-align: center; font-size: 14px; min-height: 1.2em; color: #666; }
        .label { font-weight: bold; margin-bottom: 8px; display: block; color: #444; }
    </style>
</head>
<body>

<div class="card">
    <h2>LaTeX Visualizer</h2>
    
    <span class="label">Input LaTeX:</span>
    <textarea id="input" oninput="render()">\frac{-b \pm \sqrt{b^2-4ac}}{2a}</textarea>

    <span class="label">Result:</span>
    <div id="outputContainer">
        <div id="output"></div>
    </div>

    <button id="copy-btn" onclick="copyImage()">Copy to Clipboard</button>
    <div>Background Colour:</div>
    <select onchange="bgColourSelection(this.value)">
      <option value="null">Transparent</option>
      <option value="red">Red</option>
    </select>
    <div id="status" class="status"></div>
</div>

<script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const status = document.getElementById('status');
    const btn = document.getElementById('copy-btn');

    const outputContainer = document.getElementById('outputContainer');

    bgColour = "null";

    // Handler for the LaTex Rendering
    function render() {
        try {
            katex.render(input.value, output, {
                throwOnError: false,
                displayMode: true
            });
        } catch (err) {
            output.innerHTML = "<span style='color:red;'>Syntax Error</span>";
        }
    }

    // Handler for Copying of the LaTex Resultasync function copyImage() {
    if (!input.value.trim()) {
        status.innerText = "Please enter some LaTeX first.";
        return;
    }

    btn.disabled = true;
    btn.innerText = "Generating...";
    status.innerText = "Processing image...";

    try {
        // Render to a fresh hidden div to get clean HTML
        const tempDiv = document.createElement('div');
        tempDiv.style.position = 'absolute';
        tempDiv.style.left = '-9999px';
        tempDiv.style.fontSize = '2em';
        document.body.appendChild(tempDiv);

        katex.render(input.value, tempDiv, {
            throwOnError: false,
            displayMode: true
        });

        // Grab the rendered HTML and embed KaTeX CSS inline via foreignObject
        const katexCSS = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css';

        const rect = tempDiv.getBoundingClientRect();
        const width = Math.ceil(rect.width) + 40;
        const height = Math.ceil(rect.height) + 40;

        const bgStyle = (bgColour === 'null' || bgColour === null)
            ? '' 
            : `background:${bgColour};`;

        const svgStr = `
            <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
                <foreignObject width="100%" height="100%">
                    <div xmlns="http://www.w3.org/1999/xhtml" 
                         style="display:flex;align-items:center;justify-content:center;
                                width:${width}px;height:${height}px;${bgStyle}font-size:2em;">
                        <link rel="stylesheet" href="${katexCSS}"/>
                        ${tempDiv.innerHTML}
                    </div>
                </foreignObject>
            </svg>`;

        document.body.removeChild(tempDiv);

        const blob = new Blob([svgStr], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);

        const img = new Image();
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            canvas.width = width * 3;   // high resolution
            canvas.height = height * 3;
            const ctx = canvas.getContext('2d');

            if (bgColour && bgColour !== 'null') {
                ctx.fillStyle = bgColour;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            ctx.scale(3, 3);
            ctx.drawImage(img, 0, 0);
            URL.revokeObjectURL(url);

            canvas.toBlob(async (pngBlob) => {
                try {
                    await navigator.clipboard.write([
                        new ClipboardItem({ 'image/png': pngBlob })
                    ]);
                    status.style.color = "green";
                    status.innerText = "✓ Copied to clipboard!";
                } catch (err) {
                    const link = document.createElement('a');
                    link.download = 'equation.png';
                    link.href = canvas.toDataURL();
                    link.click();
                    status.innerText = "Clipboard blocked. Downloaded as PNG instead.";
                }
                resetButton();
            }, 'image/png');
        };

        img.onerror = () => {
            status.style.color = "red";
            status.innerText = "Error rendering SVG.";
            resetButton();
        };

        img.src = url;

    } catch (e) {
        status.innerText = "Error generating image.";
        resetButton();
    }
}
    function resetButton() {
        setTimeout(() => {
            btn.disabled = false;
            btn.innerText = "Copy to Clipboard";
            status.style.color = "#666";
        }, 3000);
    }

    // Handler for BG Colour Selector
    function bgColourSelection(Colour) {
      bgColour = Colour;
      if (bgColour == 'null') {
        outputContainer.style.background = "#ffffff";
      } else {
        outputContainer.style.background = bgColour;
      }
    }

    window.onload = render;
</script>

</body>
</html>
